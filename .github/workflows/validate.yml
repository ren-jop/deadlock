name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and plists
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n build.sh
          bash -n maintenance-unlock.sh
          bash -n deadlockctl
          bash -n uninstall.sh
          plutil -lint Info.plist
          plutil -lint LaunchDaemons/com.deadlock.daemon.plist
          plutil -lint LaunchDaemons/com.deadlock.watchdog.plist
          plutil -lint LaunchAgents/com.deadlock.menubar.plist

      - name: Build current source
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release
